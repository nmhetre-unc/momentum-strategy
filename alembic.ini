# Alembic for the backtest service. The database URL is never stored here:
# env.py reads DATABASE_URL from the environment.
#
#   export DATABASE_URL=postgresql+psycopg://qbt:qbt@localhost:5432/qbt
#   alembic upgrade head
#   alembic check            # fails if qbt_service.db and the migrations disagree
#
# Migrations live inside the package (qbt_service/migrations) so an
# installed service image can run them without a repo checkout.

[alembic]
script_location = qbt_service:migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
