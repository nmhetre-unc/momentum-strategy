# Included in every location that adds headers: an add_header inside a
# location replaces all of the server's, so they can't be set once there.
# `always`: on error responses too.
#
# CSP: the built app loads only its own hashed files from this origin and
# calls the API on the same origin (/api). No inline scripts or styles:
# React and Recharts set styles through the DOM (element.style), which CSP
# allows; the e2e tests fail on any CSP violation the browser reports.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
