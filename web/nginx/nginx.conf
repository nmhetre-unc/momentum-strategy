# The dashboard's web server: the static site, and /api/ proxied to the
# API on the same origin, so the API needs no CORS headers.
#
# Runs as uid 101 on a read-only root filesystem: the pid file and every
# temp path are under /tmp (a tmpfs in compose.yaml); logs go to the
# container's stdout/stderr.

worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json
               application/problem+json image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        include /etc/nginx/security-headers.conf;

        # The healthcheck: nginx itself is up. It doesn't touch the API,
        # which has its own healthcheck.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # The API, without the /api prefix: /api/strategies -> api:8000/strategies.
        # Its responses (problem details included) pass through unchanged.
        location /api/ {
            proxy_pass http://api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            include /etc/nginx/security-headers.conf;
        }

        # Vite's hashed files: a file's name changes whenever its content
        # does, so it can be cached for a year. A missing one is a 404,
        # never index.html (a stale page asking for an old chunk must fail
        # visibly, not get HTML back as JavaScript).
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/security-headers.conf;
        }

        # Every other path is a page of the app (the router is client-side,
        # src/router.ts): an existing file, or index.html. index.html is
        # never cached without asking, so a deploy is picked up at once.
        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
        }
    }
}
