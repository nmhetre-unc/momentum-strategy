# Build the service image and publish it to GHCR, tagged with the commit SHA.
#
# Build only: nothing here can reach AWS. Deploying is scripts/deploy.sh, run
# by a person with short-lived `aws login` credentials. It copies this image
# to ECR only if its digest equals the one this run recorded, then redeploys
# over SSM. Why build and deploy are split (the account's SCP denies the
# GitHub OIDC provider): README, "Deploying to AWS".
#
# The digest is recorded twice: in the job summary, for people, and in the
# artifact image-digest (digest.txt), which deploy.sh downloads with `gh run
# download` and compares with what GHCR serves for the tag.
name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN only, and only these two scopes.
permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/nmhetre-unc/momentum-strategy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR with GITHUB_TOKEN
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push (skipped if this SHA is already published)
        # GHCR tags can be moved, so an existing tag is never overwritten:
        # a re-run records the digest that is already there.
        run: |
          set -euo pipefail
          ref="$IMAGE:$GITHUB_SHA"
          if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "$ref already exists; not rebuilding"
            echo "BUILT=no (already published)" >> "$GITHUB_ENV"
          else
            docker build --platform linux/amd64 \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "$ref" .
            docker push "$ref"
            echo "BUILT=yes" >> "$GITHUB_ENV"
          fi

      - name: Record the digest
        run: |
          set -euo pipefail
          ref="$IMAGE:$GITHUB_SHA"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for $ref"; exit 1; }
          mkdir -p image-digest
          printf '%s\n' "$digest" > image-digest/digest.txt
          jq -n --arg image "$IMAGE" --arg tag "$GITHUB_SHA" --arg digest "$digest" \
                --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                --arg ref "$GITHUB_REF" --arg built "$BUILT" \
                '{image: $image, tag: $tag, digest: $digest, ref: $ref, run: $run, built: $built}' \
                > image-digest/image.json
          {
            echo "### Published image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE:$GITHUB_SHA\` |"
            echo "| Digest | \`$digest\` |"
            echo "| Ref | \`$GITHUB_REF\` |"
            echo "| Built in this run | $BUILT |"
            echo
            echo "Deploy (from a machine signed in with \`aws login\`): \`scripts/deploy.sh $GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-digest
          path: image-digest/
          retention-days: 90
          if-no-files-found: error
