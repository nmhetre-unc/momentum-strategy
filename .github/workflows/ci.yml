name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Fail the install if the C++ extension can't be built (the default
      # is to skip it and fall back to NumPy), and fail -- rather than
      # skip -- every impl="cpp" test if it isn't importable.
      QBT_REQUIRE_EXTENSION: "1"
      QBT_REQUIRE_CPP: "1"
      # Same idea for the service's database tests: fail, don't skip, if
      # Postgres isn't reachable.
      QBT_REQUIRE_DB: "1"
      DATABASE_URL: postgresql+psycopg://qbt:qbt@localhost:5432/qbt
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qbt
          POSTGRES_PASSWORD: qbt
          POSTGRES_DB: qbt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qbt -d qbt"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (builds the C++ extension via scikit-build-core)
        run: pip install -v -e ".[dev,api,ui,ml]"  # ui: mypy checks qbt.visualize (matplotlib); ml: lightgbm

      - name: Check the extension loaded against the installed numpy
        run: |
          python -c "import numpy, qbt.bootstrap as b; \
          assert b.cpp_available(), b._EXT_UNAVAILABLE; \
          print('qbt._bootstrap_ext OK, numpy', numpy.__version__)"

      - name: Lint (ruff)
        run: ruff check

      - name: Type check (mypy)
        run: mypy src/

      - name: Bootstrap equivalence (python / numpy / cpp, bit-identical)
        run: pytest tests/test_bootstrap.py -q

      - name: Migrations (upgrade, drift check, downgrade round trip)
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Test (pytest)
        run: pytest --cov=src/qbt --cov=src/qbt_service --cov-report=

      - name: Coverage (qbt >= 82%, qbt_service >= 90%)
        run: |
          coverage report --include='src/qbt/*' --fail-under=82
          coverage report --include='src/qbt_service/*' --fail-under=90

  # The service end to end, as it ships: build the image, start the Compose
  # stack (db -> migrate -> api, worker) under its own project, ingest a
  # short range of SPY from Yahoo, POST one backtest, poll until it
  # succeeds, and check its metrics equal a direct qbt.runner run on the
  # same snapshot. Runs alongside `test`.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compose smoke test (build, up, ingest, one backtest)
        # Standard library only, so nothing to install.
        run: >-
          python scripts/compose_smoke.py --quick --project qbt-ci
          --start 2023-01-01 --end 2025-01-01

      - name: Service logs (on failure)
        if: failure()
        run: >-
          docker compose -p qbt-ci -f compose.yaml -f scripts/compose.smoke.yaml
          logs --no-color --timestamps

      - name: Tear down
        if: always()
        run: >-
          docker compose -p qbt-ci -f compose.yaml -f scripts/compose.smoke.yaml
          down -v --remove-orphans

  # The dashboard (web/): lint, types, unit tests, the API schema check and
  # the production build, then Playwright against the Compose stack served
  # through nginx. npm run test:e2e always builds every image fresh
  # (docker compose up --build): an image left from an earlier build would
  # silently lack newer API routes. Runs alongside `test` and `e2e`.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # For api:check, which exports the schema from the Python code.
      - name: Install the service (schema export only)
        working-directory: .
        run: pip install -e ".[api,ml]"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (exactly the lock file)
        run: npm ci

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: API schema and client are current
        run: npm run api:check

      - name: Build
        run: npm run build

      - name: End to end (Compose built fresh, Playwright in its image)
        # --keep: the next steps read its logs, then tear it down.
        run: npm run test:e2e -- --keep
        env:
          CI: "true"

      - name: Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

      - name: Service logs (on failure)
        if: failure()
        working-directory: .
        run: docker compose -p qbt-e2e -f compose.yaml logs --no-color --timestamps

      - name: Tear down
        if: always()
        working-directory: .
        run: docker compose -p qbt-e2e -f compose.yaml down -v --remove-orphans
