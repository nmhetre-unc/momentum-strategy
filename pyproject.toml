[build-system]
# numpy is pinned to exactly the runtime version below: the C++ extension
# links this numpy's libnpyrandom and records its version, and
# qbt.bootstrap refuses to use the extension under any other numpy (the
# random stream is only guaranteed identical within one numpy release).
# Bump both pins together.
requires = ["scikit-build-core>=0.10", "pybind11==2.13.6", "numpy==2.5.4"]
build-backend = "scikit_build_core.build"

[project]
name = "qbt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy==2.5.4",  # must equal the [build-system] pin; see there
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
# The Streamlit dashboard (app/) and the CLI's charts (main.py, via
# qbt.visualize). Not in [project.dependencies] so the service image
# doesn't carry them; requirements.txt (the Streamlit Cloud deploy)
# installs `-e .[ui]`.
ui = [
    "matplotlib>=3.8",
    "altair>=5.4",
    "streamlit>=1.62",
]
# The C2 monthly models (qbt.ml.models imports it lazily). Not a base
# dependency: the service and the Streamlit deploy never train it.
ml = [
    "lightgbm>=4.5",
]
dev = [
    "pytest",
    "pytest-cov",
    # ruff and mypy are pinned exactly so local and CI type-check/lint against
    # the same rules -- an unpinned mypy in particular drifts in how it infers
    # pandas ufunc results across releases, which reads as a code bug until
    # you notice the version differs.
    "ruff==0.16.6",
    "mypy==2.4.1",
    "pandas-stubs==3.0.5.260730",
    "hypothesis",
    "pytest-benchmark",  # benchmarks/ only; never collected by the normal run
]
# The backtest service (src/qbt_service). Kept out of [project.dependencies]
# so the library, CLI and Streamlit deploy (requirements.txt) don't pull in
# a web framework and a database driver they never use.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    # >=2.1: results are unpacked as plain Rows; 2.0 needed Result.tuples(),
    # which 2.1 deprecates (an error under pytest's filterwarnings).
    "sqlalchemy>=2.1",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    # FastAPI's TestClient and the bench/ load generator. httpx2, not httpx:
    # Starlette >= 1.10's TestClient warns (an error under pytest's
    # filterwarnings) when it has to fall back to httpx.
    "httpx2>=2.16",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/qbt", "src/qbt_service"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
filterwarnings = ["error"]
# benchmarks/ is run explicitly (see benchmarks/README.md), not by a bare `pytest`.
testpaths = ["tests"]
markers = [
    "db: needs PostgreSQL via DATABASE_URL (skipped without it unless QBT_REQUIRE_DB=1)",
]

[tool.coverage.run]
# Measure the worker's own processes too: `python -m qbt_service.worker`
# started by the process tests (patch = subprocess) and the compute child
# it spawns (concurrency = multiprocessing). sigterm: save data when a
# process is stopped with SIGTERM; a SIGKILLed one records nothing.
patch = ["subprocess"]
concurrency = ["thread", "multiprocessing"]
sigterm = true

[tool.mypy]
python_version = "3.12"

# sklearn and yfinance ship no inline types and have no dev-installed stub
# package; scipy-stubs exists but isn't pulled in here. pandas gets real
# coverage via pandas-stubs above instead of being ignored.
[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "yfinance.*"]
ignore_missing_imports = true
