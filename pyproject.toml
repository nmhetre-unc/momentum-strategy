[build-system]
# numpy is pinned to exactly the runtime version below: the C++ extension
# links this numpy's libnpyrandom and records its version, and
# qbt.bootstrap refuses to use the extension under any other numpy (the
# random stream is only guaranteed identical within one numpy release).
# Bump both pins together.
requires = ["scikit-build-core>=0.10", "pybind11==2.13.6", "numpy==2.5.4"]
build-backend = "scikit_build_core.build"

[project]
name = "qbt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy==2.5.4",  # must equal the [build-system] pin; see there
    "matplotlib>=3.8",
    "altair>=5.4",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "streamlit>=1.62",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    # ruff and mypy are pinned exactly so local and CI type-check/lint against
    # the same rules -- an unpinned mypy in particular drifts in how it infers
    # pandas ufunc results across releases, which reads as a code bug until
    # you notice the version differs. mypy==1.10.0 predates the "librt"
    # compiled runtime newer mypy ships, which this machine's Windows
    # Application Control policy blocks outright.
    "ruff==0.16.6",
    "mypy==1.10.0",
    "pandas-stubs==3.0.5.260730",
    "hypothesis",
    "pytest-benchmark",  # benchmarks/ only; never collected by the normal run
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/qbt"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
filterwarnings = ["error"]
# benchmarks/ is run explicitly (see benchmarks/README.md), not by a bare `pytest`.
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"

# sklearn and yfinance ship no inline types and have no dev-installed stub
# package; scipy-stubs exists but isn't pulled in here. pandas gets real
# coverage via pandas-stubs above instead of being ignored.
[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "yfinance.*"]
ignore_missing_imports = true
