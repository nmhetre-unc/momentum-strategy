[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qbt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "altair>=5.4",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "streamlit>=1.62",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pandas-stubs==3.0.5.260730",
    "hypothesis",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.12"

# sklearn and yfinance ship no inline types and have no dev-installed stub
# package; scipy-stubs exists but isn't pulled in here. pandas gets real
# coverage via pandas-stubs above instead of being ignored.
[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "yfinance.*"]
ignore_missing_imports = true
